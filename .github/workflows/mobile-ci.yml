name: Mobile CI
on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'package.json'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'package.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      - name: Test price calculations
        run: npm test
      - name: Check iOS and iPad source types
        run: npm run typecheck -w @trolleyscout/mobile
